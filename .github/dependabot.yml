# Keeps the SHA-pinned GitHub Actions current (security fixes arrive as PRs). There are no Swift or
# Python package dependencies. The vendored GAM is deliberately not here: it is pinned by SHA-256 in
# scripts/gam_checksums.txt and bumped with scripts/bump_gam.py (GitHub build attestation, fails closed).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # CodeQL refuses to run when its steps' versions differ ("All steps in a workflow that use
    # github/codeql-action must use the same version"), so its init, analyze and upload-sarif move in
    # one PR (2026-10-12: three separate bumps each failed CodeQL).
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
