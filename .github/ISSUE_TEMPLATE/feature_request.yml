name: Feature request
description: An admin chore GAM GUI should handle, or a screen that could work better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Two things shape what gets built: GAM GUI is **macOS-only by design**, and every new
        *change* is added deliberately: a preview, the confirm guard, an audit line, and a live
        run on a throwaway account before it is trusted. Reads are cheap; the Builder already runs
        GAM's read commands. A broader idea, or one still taking shape, fits
        [Discussions → Ideas](https://github.com/goetchstone/SwiftGamGui/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: The chore or problem
      description: What you do today, how often, and what makes it painful.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What GAM GUI would do
      description: The screen or change you have in mind, as rough as you like.
  - type: textarea
    id: gam
    attributes:
      label: The gam command(s), if you know them
      description: Exactly as you'd type them, with example values.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup
        - Home
        - Users
        - Groups
        - Shared drives
        - Signatures
        - Calendars
        - Classroom
        - Builder
        - Onboard
        - Offboard
        - Incident
        - Phishing
        - Reports
        - Audit
        - Files
        - Building or launching the app
        - Other
