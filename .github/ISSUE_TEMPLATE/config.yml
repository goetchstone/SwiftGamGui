blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/goetchstone/SwiftGamGui/security/advisories/new
    about: Privately, never in a public issue. GAM GUI holds domain-wide credentials.
  - name: Ask a question
    url: https://github.com/goetchstone/SwiftGamGui/discussions/categories/q-a
    about: Building it, setup, "how do I…", or whether GAM GUI fits your domain.
  - name: A GAM question, not a GAM GUI one
    url: https://github.com/GAM-team/GAM/wiki
    about: How a gam command behaves, or an error GAM itself prints for the same command.
