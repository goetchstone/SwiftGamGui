name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing here writes back. GITHUB_TOKEN only authenticates fetch_gam.sh's api.github.com
# calls (the anonymous limit is 60/hr).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No credential or local-only file is tracked
        run: |
          if git ls-files | grep -E '(^|/)(oauth2service\.json|oauth2\.txt|client_secrets\.json|Local\.xcconfig|private-terms)$'; then
            echo "::error::a credential or local-only file is tracked"
            exit 1
          fi
      - name: Scripts parse
        run: |
          python3 -m py_compile scripts/*.py
          bash -n scripts/fetch_gam.sh scripts/check_app.sh scripts/embed_gam.sh scripts/fuzz.sh scripts/screenshots.sh Tests/Fixtures/mock_gam.sh
      - name: No invisible or bidirectional characters in source
        run: python3 -I scripts/check_text.py

  macos:
    # GitHub's xcode-27 image (preview): macOS 27 + Xcode 27, what the app targets. No signing team
    # here, so the app builds ad-hoc with the empty entitlements — the contributor-without-a-team path.
    name: build + test (macOS 27)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sw_vers && xcodebuild -version && swift --version
      - name: Package tests (strict mock gam, GamGUI parity fixtures, snapshot spike)
        run: |
          mkdir -p "$RUNNER_TEMP/attachments"
          swift test --package-path Packages/GamKit --attachments-path "$RUNNER_TEMP/attachments"
      - name: Vendor the pinned GAM (fails closed on a checksum mismatch)
        run: |
          ./scripts/fetch_gam.sh
          git diff --exit-code -- Vendor/gam7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the app (Release; embeds and signs GAM)
        run: xcodebuild -project SwiftGamGui.xcodeproj -scheme GamGUI -configuration Release -derivedDataPath "$RUNNER_TEMP/dd" build
      - name: Hardened runtime, entitlement allowlist, embedded GAM signed and runnable at the pinned version
        run: scripts/check_app.sh "$RUNNER_TEMP/dd/Build/Products/Release/GamGUI.app"
      - name: Screenshots (debug build, demo tenant and the strict mock GAM only)
        run: |
          xcodebuild -project SwiftGamGui.xcodeproj -scheme GamGUI -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd" build
          scripts/screenshots.sh "$RUNNER_TEMP/dd/Build/Products/Debug/GamGUI.app" "$RUNNER_TEMP/attachments/screens"
      - name: Keep the snapshot attachments
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshots
          path: ${{ runner.temp }}/attachments
          if-no-files-found: ignore

  fuzz:
    # Coverage-guided fuzzing (libFuzzer, Fuzz/GamFuzz.swift) of GamEngine's platform-free code: GAM output
    # parsers, the error classifier and its masking, argv-only builders, closed-set validators. Linux only
    # (Apple's toolchain ships no libFuzzer runtime), in the official Swift image pinned by digest.
    name: fuzz (libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: swift:6.4@sha256:4601bf61dab9485a3e93087770b72d268737e945a5b000e2286b6cc48bb048b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fuzz
        run: |
          # In the workspace: inside a container, runner.temp names the host's path, not this one.
          mkdir -p fuzz-crash
          scripts/fuzz.sh -seed=1 -runs=300000 -max_len=4096 -print_final_stats=1 -artifact_prefix=fuzz-crash/
      - name: Keep a crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash
          path: fuzz-crash
          if-no-files-found: ignore

  # The one required check for branch protection.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [hygiene, macos, fuzz]
    if: always()
    steps:
      - name: Every job passed
        env:
          HYGIENE: ${{ needs.hygiene.result }}
          MACOS: ${{ needs.macos.result }}
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          echo "hygiene=$HYGIENE macos=$MACOS fuzz=$FUZZ"
          test "$HYGIENE" = success && test "$MACOS" = success && test "$FUZZ" = success
